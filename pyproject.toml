[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-visualization-guide"
version = "0.1.0"
description = "Beginner guide and reusable paper visualization core"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.7", "numpy>=1.24", "pandas>=2.0"]

[tool.setuptools]
package-dir = {"" = "figure"}

[tool.setuptools.packages.find]
where = ["figure"]
include = ["polarviz*"]
